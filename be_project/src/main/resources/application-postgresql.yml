# ============================================
# Application Configuration - PostgreSQL
# ============================================
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mathbridge
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
    open-in-view: false
  flyway:
    enabled: false

# JWT Configuration
jwt:
  secret: MathBridge_Secret_Key_2024_Change_In_Production_256bit_Minimum_Required_Length_For_HS256_Algorithm
  expiration-ms: 86400000  # 24 hours

# Cho phép FE Next.js gọi API
cors:
  origins: http://localhost:3000


