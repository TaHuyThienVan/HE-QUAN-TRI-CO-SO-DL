# ============================================
# MathBridge - Application Configuration
# Mặc định sử dụng H2 Database (không cần cài đặt)
# ============================================
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    # H2 Database - Embedded (không cần cài đặt)
    url: jdbc:h2:mem:mathbridge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: false
    open-in-view: false
  flyway:
    enabled: false

# JWT Configuration
jwt:
  secret: MathBridge_Secret_Key_2024_Change_In_Production_256bit_Minimum_Required_Length_For_HS256_Algorithm
  expiration-ms: 86400000  # 24 hours

# Cho phép FE Next.js gọi API
cors:
  origins: http://localhost:3000